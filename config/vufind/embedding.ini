[Embedding]
; This section controls features related to semantic search.
; See also: https://solr.apache.org/guide/solr/latest/query-guide/dense-vector-search.html
; embedding_api_url default is null
embedding_api_url = "http://localhost:11434/v1/embeddings"
; embedding_api_key default is ""
embedding_api_key = ""
; embedding_site_url default is ""
embedding_site_url = ""
; embedding_app_name default is ""
embedding_app_name = ""
; vector_field default is "vector"
vector_field      = "vector"
; vector_multivalued default is false
vector_multivalued = false
; Enable highlighting in semantic and hybrid search. VuFind's searches.ini
; highlighting and snippets settings also control whether highlights are displayed.
; Default: true
highlight_enabled = true
; topK default is 10
topK              = 10
; default_core default is "biblio"
default_core      = "biblio"
; min_score is the vector similarity threshold when query_parser is vectorSimilarity.
; It applies to the vector component of semantic and hybrid searches, not the RRF score.
; A low threshold can return many candidates and increase query cost.
; Semantic backend default is 0.0; hybrid backend default is 0.7.
min_score         = 0.7
; model default is null
model             = "bge-m3"
; Optional literal prefix for search queries sent to the embedding API.
; Include any separator or trailing space required by the model. Default: empty.
; Example for EmbeddingGemma 2:
; query_prefix = "task: search result | query: "
query_prefix = ""
; rrf_k default is 60
rrf_k             = 60
; encoding_format default is "float"
encoding_format   = "float"
; dimension default is 1024
dimension          = 1024
; Vector query parser for semantic search and the vector component of hybrid search.
; query_parser default is "knn"
; query_parser values should be "knn" or "vectorSimilarity"
; topK is ignored when query_parser is "vectorSimilarity"
query_parser      = "knn"

