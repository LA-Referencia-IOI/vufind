services:
  solr-nightly:
    image: apache/solr-nightly:10.1.0-SNAPSHOT
    container_name: solr-nightly
    restart: unless-stopped
    ports:
      - "${SOLR_PORT:-8983}:8983"
    environment:
      SOLR_HEAP: "${SOLR_HEAP:-2g}"
      SOLR_MODULES: "analysis-extras"
      SOLR_OPTS: >-
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Xlog:gc*:stdout
        -Dsolr.security.allow.urls.enabled=false
    command:
      - solr
      - start
      - -f
      - --user-managed
    volumes:
      - ../volumes/solr:/var/solr
      - ../volumes/solr/data/jars/MarcImporter.jar:/opt/solr/server/solr-webapp/webapp/WEB-INF/lib/MarcImporter.jar:ro
      - ../volumes/solr/data/jars/browse-handler.jar:/opt/solr/server/solr-webapp/webapp/WEB-INF/lib/browse-handler.jar:ro
      - ../volumes/solr/data/jars/sqlite-jdbc-3.39.3.0.jar:/opt/solr/server/solr-webapp/webapp/WEB-INF/lib/sqlite-jdbc-3.39.3.0.jar:ro
